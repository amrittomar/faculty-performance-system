spring:
  datasource:
    url: jdbc:h2:mem:fpis;MODE=PostgreSQL;DB_CLOSE_DELAY=-1;DATABASE_TO_LOWER=TRUE
    username: sa
    password:
    driver-class-name: org.h2.Driver
  jpa:
    database-platform: org.hibernate.dialect.H2Dialect
    hibernate:
      ddl-auto: create-drop
  flyway:
    enabled: false
fpis:
  jwt:
    secret: local-only-demo-secret-key-must-be-at-least-32-bytes
