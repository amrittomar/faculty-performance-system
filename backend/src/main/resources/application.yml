spring:
  application:
    name: fpis-backend
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/fpis}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        format_sql: true
  flyway:
    enabled: true
management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      show-details: when_authorized
server:
  error:
    include-message: always
fpis:
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5173,http://127.0.0.1:5173}
  jwt:
    secret: ${JWT_SECRET}
    expiration-ms: ${JWT_EXPIRATION_MS:3600000}
---
spring:
  config:
    activate:
      on-profile: local
  datasource:
    username: ${DB_USERNAME:fpis}
    password: ${DB_PASSWORD:fpis_local_only}
fpis:
  jwt:
    secret: ${JWT_SECRET:local-only-demo-secret-key-must-be-at-least-32-bytes}
---
spring:
  config:
    activate:
      on-profile: test
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/fpis_test}
    username: ${DB_USERNAME:fpis}
    password: ${DB_PASSWORD:fpis_local_only}
fpis:
  jwt:
    secret: ${JWT_SECRET:test-only-secret-key-must-be-at-least-32-bytes}
