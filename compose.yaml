services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: fpis
      POSTGRES_USER: fpis
      POSTGRES_PASSWORD: fpis_local_only
    ports:
      - "5432:5432"
    volumes:
      - fpis-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U fpis -d fpis"]
      interval: 5s
      timeout: 5s
      retries: 12

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      SPRING_PROFILES_ACTIVE: local
      DB_URL: jdbc:postgresql://postgres:5432/fpis
      DB_USERNAME: fpis
      DB_PASSWORD: fpis_local_only
      CORS_ALLOWED_ORIGINS: http://localhost:5173,http://127.0.0.1:5173
    ports:
      - "8080:8080"

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        VITE_API_URL: http://localhost:8080/api
    depends_on:
      - backend
    ports:
      - "5173:80"

volumes:
  fpis-postgres-data:
